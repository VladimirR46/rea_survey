{# Иконки в одном месте: тонкие линии, цвет берут из текста #}
{% macro icon(name, cls="ico") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "target" -%}
<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
{%- elif name == "bulb" -%}
<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "wallet" -%}
<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3.5" y="8" width="17" height="11" rx="2.5"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor"/>
{%- elif name == "key" -%}
<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14.5 8.5l2 2"/>
{%- elif name == "shield" -%}
<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "check" -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "arrow" -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "back" -%}
<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "timer" -%}
<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9.5 2.5h5"/>
{%- elif name == "cards" -%}
<rect x="3" y="5" width="5.5" height="14" rx="1.5"/><rect x="9.25" y="5" width="5.5" height="14" rx="1.5"/><rect x="15.5" y="5" width="5.5" height="14" rx="1.5"/>
{%- elif name == "lock" -%}
<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
{%- elif name == "book" -%}
<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>
{%- elif name == "sparkle" -%}
<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/>
{%- endif -%}
</svg>
{%- endmacro %}
