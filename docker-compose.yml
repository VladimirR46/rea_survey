services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # только для nginx на этом же сервере, снаружи порт закрыт
      - "127.0.0.1:8000:8000"
    volumes:
      # код с диска: после git pull сервер подхватит правки сам,
      # пересборка нужна только при изменении requirements.txt
      - ./:/app
      # база в папке проекта, переживает пересоздание контейнера
      - ./data:/data
    # Правки здесь --reload НЕ подхватывает: после изменения выполните
    # `docker compose up -d`, чтобы контейнер пересоздался с новыми значениями
    environment:
      SCRIPT_NAME: /survey
      # Ключ подписи кук сессий. На сервере задаётся в файле .env (он не в git):
      # echo "SECRET_KEY=$(openssl rand -hex 32)" > .env
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production}
      # Сколько дней респондент может вернуться и продолжить с того же места
      SESSION_DAYS: 14
      # Параметры опроса
      DESIGN_MODE: individual
      N_TASKS: 10
      DESIGN_SEED: 20260901
      # Сколько ситуаций повторить в конце с переставленными колонками
      # (добавляются сверх N_TASKS: 10 + 2 = 12)
      N_REPEATS: 2
      # Ключ страницы выгрузки /survey/results. Задаётся в .env:
      # echo "RESULTS_KEY=$(openssl rand -hex 12)" >> .env
      # Пустой — страница выключена (404)
      RESULTS_KEY: ${RESULTS_KEY:-}
    # --threads обязателен. Без него gunicorn обрабатывает по одному
    # соединению за раз: браузер открывает соединения заранее, ничего в них
    # не отправляя, и один такой пустой сокет останавливает весь сервер.
    command: gunicorn --bind 0.0.0.0:8000 --worker-class gthread --threads 32 --reload app:app
