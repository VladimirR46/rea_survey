{% extends "base.html" %}
{% block title %}Выгрузка результатов{% endblock %}

{% block content %}
    <h1>Выгрузка результатов</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('results') }}">
        <input type="password" name="key" class="key-input" placeholder="Ключ доступа"
               aria-label="Ключ доступа" autocomplete="current-password" required autofocus>
        <button type="submit" class="btn-primary">Скачать CSV</button>
    </form>
{% endblock %}
